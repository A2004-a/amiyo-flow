name: Bug Report
description: Report an issue or bug in AMIYO FLOW
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in AMIYO FLOW. Please provide as much context as possible.
  - type: input
    id: version
    attributes:
      label: Application Version
      description: What version of AMIYO FLOW are you using?
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true
  - type: dropdown
    id: target_app
    attributes:
      label: Target Application
      description: Which external application were you voice typing into?
      options:
        - Claude (Web or Desktop)
        - Antigravity / Cursor / VS Code
        - ChatGPT (Web or Desktop)
        - Google Chrome / Brave / Edge
        - Microsoft Word / Google Docs
        - Slack / Discord / Teams
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Describe the problem clearly and concisely.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: List step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open target application
        2. Press global hotkey
        3. Speak dictation
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
