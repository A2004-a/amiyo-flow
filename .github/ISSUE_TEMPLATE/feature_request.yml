name: Feature Request
description: Propose a new feature, integration, or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an improvement or new feature for AMIYO FLOW on-device voice typing.
  - type: textarea
    id: proposal
    attributes:
      label: Feature Description
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Problem or Use Case
      description: What problem does this solve, or what workflow does it enhance?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      options:
        - Audio Capture / VAD
        - Local Speech Recognition (Whisper)
        - Local Heuristic & LLM Text Formatting
        - Universal Text Injection
        - Meeting Assistant
        - UI / Floating HUD Pill
        - Other
    validations:
      required: true
